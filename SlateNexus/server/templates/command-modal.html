<div id="command-modal" class="modal show">
	<div class="modal-content">
		<div class="modal-header">
			<h2>Remote Command - {{ .Host.Hostname }}</h2>
		</div>
		<div class="modal-body" id="terminal"
			style="display: flex; flex-direction: column; height: 500px; padding: 10px; background-color: #1e1e1e; color: #d4d4d4; font-family: monospace;"
			hx-get="/htmx/command-results/{{ .Host.ID }}?since={{ .SessionStart }}" hx-trigger="load, every 2s"
			hx-target="#history">

			<div id="history" style="flex-grow: 1; overflow-y: auto; padding: 5px; border-bottom: 1px solid #555;">
				<!-- Command history will be loaded here -->
			</div>

			<div class="command-line" style="display: flex; align-items: center; padding-top: 10px;">
				<span style="margin-right: 5px;">&gt;</span>
				<input type="text" id="command-input" name="command" placeholder="Enter command and press Enter"
					style="flex-grow: 1; background-color: transparent; border: none; outline: none; color: #d4d4d4; font-family: monospace; font-size: 1em;"
					hx-post="/htmx/run-command/{{ .Host.ID }}" hx-target="#history" hx-swap="beforeend"
					hx-trigger="keydown[key=='Enter']" hx-on::after-request="this.value=''" />
			</div>
		</div>
		<div class="modal-footer" style="text-align: right; padding: 10px;">
			<button class="close-btn" hx-get="/htmx/close-modal" hx-target="#modal-container">Close</button>
		</div>
	</div>
</div>
